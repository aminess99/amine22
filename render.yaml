# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-video-editor
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set in the Render dashboard; never commit the key.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      # Model for editing commands typed in the editor.
      - key: COMMAND_MODEL
        value: google/gemini-2.5-flash
      # Text-to-speech model (returns PCM; the server wraps it as WAV).
      - key: TTS_MODEL
        value: google/gemini-3.8-flash-lite-tts
      # Freesound API key for the sound-effects search (CC0 only); set in the dashboard.
      - key: FREESOUND_API_KEY
        sync: false
